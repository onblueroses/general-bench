[project]
name = "general-bench"
version = "0.0.1"
description = "LLMs as generals: a free Kriegsspiel engine with a machine umpire, model against model on designed battles."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]
figures = ["matplotlib>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kriegsspiel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "PL", "BLE", "ISC"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # engine rules have many branches and named numbers
    "PLC0415",  # local imports break import cycles between engine modules
    "RUF001", "RUF002", "RUF003",  # place names carry diacritics (Kolín)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011"]
